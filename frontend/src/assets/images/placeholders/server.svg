<svg width="300" height="300" viewBox="0 0 300 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="300" height="300" fill="#FAF9FF"/>
  
  <!-- Geometric accent -->
  <path d="M0 0 L150 0 L0 150 Z" fill="#143B7D" opacity="0.05"/>
  
  <!-- Server icon -->
  <g transform="translate(100, 90)">
    <!-- Server rack -->
    <rect x="0" y="0" width="100" height="30" rx="4" fill="#EEEDF4" stroke="#143B7D" stroke-width="2"/>
    <rect x="0" y="40" width="100" height="30" rx="4" fill="#EEEDF4" stroke="#143B7D" stroke-width="2"/>
    <rect x="0" y="80" width="100" height="30" rx="4" fill="#EEEDF4" stroke="#143B7D" stroke-width="2"/>
    
    <!-- Indicator lights -->
    <circle cx="10" cy="15" r="3" fill="#A9371D"/>
    <circle cx="20" cy="15" r="3" fill="#80002B"/>
    <circle cx="10" cy="55" r="3" fill="#A9371D"/>
    <circle cx="20" cy="55" r="3" fill="#80002B"/>
    <circle cx="10" cy="95" r="3" fill="#A9371D"/>
    <circle cx="20" cy="95" r="3" fill="#80002B"/>
  </g>
  
  <!-- Label -->
  <text x="150" y="240" font-family="Manrope, sans-serif" font-size="14" fill="#434750" text-anchor="middle">
    Server
  </text>
</svg>
