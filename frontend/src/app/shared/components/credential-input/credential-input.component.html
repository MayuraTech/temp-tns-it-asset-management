<!-- 
  Credential Input Component Template
  
  Implements minimalist bottom-border styling per Editorial Geometry.
  Supports text and password input types with validation and error display.
  
  Requirements: 1.1, 9.2, 9.3
-->

<div class="credential-input-container">
  <!-- Input Label - Requirement 1.1 -->
  <label 
    *ngIf="label" 
    [for]="inputId" 
    class="credential-input-label"
    [class.credential-input-label--error]="error">
    {{ label }}
  </label>
  
  <!-- Input Field Wrapper -->
  <div class="credential-input-wrapper">
    <!-- Input Field - Requirement 9.2 (minimalist bottom-border styling) -->
    <input
      [id]="inputId"
      [type]="getCurrentInputType()"
      [value]="value"
      [disabled]="disabled"
      [placeholder]="placeholder"
      [autocomplete]="autocomplete"
      [autofocus]="autofocus"
      [attr.aria-label]="label"
      [attr.aria-describedby]="error ? inputId + '-error' : null"
      [attr.aria-invalid]="error ? 'true' : 'false'"
      class="credential-input-field"
      [class.credential-input-field--error]="error"
      [class.credential-input-field--disabled]="disabled"
      (input)="onInputChange($event)"
      (blur)="onInputBlur()"
      (keypress)="onKeyPress($event)"
    />
    
    <!-- Password Visibility Toggle Button -->
    <button
      *ngIf="showVisibilityToggle && type === 'password'"
      type="button"
      class="credential-input-toggle"
      [attr.aria-label]="isPasswordVisible ? 'Hide password' : 'Show password'"
      [disabled]="disabled"
      (click)="onVisibilityToggleClick()"
      (keydown.enter)="onVisibilityToggleClick()"
      (keydown.space)="onVisibilityToggleClick(); $event.preventDefault()">
      <!-- Eye Icon - Show Password (when hidden) -->
      <svg 
        *ngIf="!isPasswordVisible"
        class="credential-input-toggle-icon" 
        width="20" 
        height="20" 
        viewBox="0 0 24 24" 
        fill="none" 
        xmlns="http://www.w3.org/2000/svg">
        <path 
          d="M12 5C7 5 2.73 8.11 1 12.5 2.73 16.89 7 20 12 20s9.27-3.11 11-7.5C21.27 8.11 17 5 12 5zm0 12.5c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"
          fill="currentColor"/>
      </svg>
      <!-- Eye Slash Icon - Hide Password (when visible) -->
      <svg 
        *ngIf="isPasswordVisible"
        class="credential-input-toggle-icon credential-input-toggle-icon--visible" 
        width="20" 
        height="20" 
        viewBox="0 0 24 24" 
        fill="none" 
        xmlns="http://www.w3.org/2000/svg">
        <path 
          d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.43-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm4.31-.78l3.15 3.15.02-.16c0-1.66-1.34-3-3-3l-.17.01z"
          fill="currentColor"/>
      </svg>
    </button>
  </div>
  
  <!-- Error Message - Requirement 1.1 -->
  <div 
    *ngIf="error" 
    [id]="inputId + '-error'"
    class="credential-input-error"
    role="alert"
    aria-live="polite">
    {{ error }}
  </div>
</div>
