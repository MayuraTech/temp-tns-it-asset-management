<div class="notification-panel">
  <div class="panel-header">
    <h3>Notifications</h3>
    <div class="header-actions">
      <span class="unread-badge" *ngIf="(unreadCount$ | async) as count">
        {{ count }}
      </span>
      <button class="btn-refresh" (click)="refresh()" title="Refresh">
        ↻
      </button>
      <button class="btn-mark-all" (click)="markAllAsRead()" title="Mark all as read">
        ✓ All
      </button>
    </div>
  </div>

  <div class="notifications-list" *ngIf="!(loading$ | async)">
    <div 
      *ngFor="let notification of notifications$ | async"
      class="notification-item"
      [class.unread]="!notification.isRead"
      (click)="navigateToTicket(notification)">
      
      <div class="notification-indicator" *ngIf="!notification.isRead"></div>
      
      <div class="notification-content">
        <div class="notification-header">
          <span class="ticket-number">{{ notification.ticketNumber }}</span>
          <span class="notification-time">{{ notification.createdAt | date:'short' }}</span>
        </div>
        
        <div class="notification-message">
          {{ notification.message }}
        </div>
        
        <div class="notification-asset">
          Asset: {{ notification.assetName }}
        </div>
      </div>
    </div>

    <div class="empty-state" *ngIf="(notifications$ | async)?.length === 0">
      <p>No notifications</p>
    </div>
  </div>

  <div class="loading-state" *ngIf="loading$ | async">
    Loading notifications...
  </div>
</div>
