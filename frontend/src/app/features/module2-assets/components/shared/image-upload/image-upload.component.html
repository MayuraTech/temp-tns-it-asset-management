<div class="image-upload-container">
  <!-- Hidden file input -->
  <input
    #fileInput
    type="file"
    [accept]="acceptedFormats.join(',')"
    (change)="onFileSelected($event)"
    style="display: none;"
  />
  
  <!-- Current image display -->
  <div *ngIf="currentImageUrl && !previewUrl" class="current-image">
    <img [src]="currentImageUrl" alt="Current asset image" class="image-preview" />
    <div class="image-overlay">
      <button
        type="button"
        class="btn-change-image"
        (click)="openFileDialog()"
        [disabled]="disabled"
      >
        Change Image
      </button>
      <button
        type="button"
        class="btn-remove-image"
        (click)="removeFile()"
        [disabled]="disabled"
      >
        Remove
      </button>
    </div>
  </div>
  
  <!-- Preview of selected image -->
  <div *ngIf="previewUrl" class="image-preview-container">
    <img [src]="previewUrl" alt="Image preview" class="image-preview" />
    <div class="preview-info">
      <p class="file-name">{{ selectedFile?.name }}</p>
      <p class="file-size">{{ getFormattedFileSize(selectedFile?.size || 0) }}</p>
    </div>
    <div class="preview-actions">
      <button
        type="button"
        class="btn-change-image"
        (click)="openFileDialog()"
        [disabled]="disabled"
      >
        Change
      </button>
      <button
        type="button"
        class="btn-remove-image"
        (click)="removeFile()"
        [disabled]="disabled"
      >
        Remove
      </button>
    </div>
  </div>
  
  <!-- Upload area (shown when no image) -->
  <div
    *ngIf="!currentImageUrl && !previewUrl"
    class="upload-area"
    [class.drag-over]="isDragOver"
    [class.disabled]="disabled"
    (dragover)="onDragOver($event)"
    (dragleave)="onDragLeave($event)"
    (drop)="onDrop($event)"
    (click)="openFileDialog()"
  >
    <div class="upload-content">
      <!-- Upload icon -->
      <svg class="upload-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
        <polyline points="7,10 12,15 17,10"></polyline>
        <line x1="12" y1="15" x2="12" y2="3"></line>
      </svg>
      
      <h3 class="upload-title">Upload Asset Image</h3>
      <p class="upload-description">
        Drag and drop an image here, or click to select
      </p>
      <p class="upload-formats">
        Supported formats: {{ acceptedExtensions }}
      </p>
      <p class="upload-size-limit">
        Maximum size: {{ getFormattedFileSize(maxSizeBytes) }}
      </p>
    </div>
  </div>
  
  <!-- Default placeholder for asset types -->
  <div *ngIf="!currentImageUrl && !previewUrl" class="placeholder-section">
    <p class="placeholder-text">Or use a default placeholder:</p>
    <div class="placeholder-options">
      <button
        type="button"
        class="placeholder-btn"
        (click)="useDefault()"
        [disabled]="disabled"
      >
        Use Default
      </button>
    </div>
  </div>
</div>
