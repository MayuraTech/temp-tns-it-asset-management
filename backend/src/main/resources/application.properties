# ============================================================================
# Base Application Configuration
# This file contains common configuration shared across all environments.
# Environment-specific settings are in application-{profile}.properties
# ============================================================================

# Application Metadata
spring.application.name=it-asset-management
server.port=${SERVER_PORT:8080}

# Context Path - Serve API at /qa/api/
server.servlet.context-path=/qa/api

# ============================================================================
# Database Configuration
# ============================================================================
spring.datasource.url=${DB_URL:jdbc:sqlserver://fileracks-sql-db.tnssinc.com:1433;databaseName=IT_Asset;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${DB_USERNAME:yuvaraj}
spring.datasource.password=${DB_PASSWORD:YmTnS@12345}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# JPA/Hibernate Base Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
# Use standard naming: do not convert CreatedBy -> created_by / UserId -> user_id.
# Entities rely on PascalCase @Column and @JoinColumn names matching SQL Server.
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.open-in-view=false

# Hibernate Performance Optimization
spring.jpa.properties.hibernate.default_batch_fetch_size=10
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.properties.hibernate.jdbc.batch_versioned_data=true
spring.jpa.properties.hibernate.query.in_clause_parameter_padding=true
spring.jpa.properties.hibernate.query.fail_on_pagination_over_collection_fetch=true
spring.jpa.properties.hibernate.query.plan_cache_max_size=2048
spring.jpa.properties.hibernate.query.plan_parameter_metadata_max_size=128
spring.jpa.properties.hibernate.temp.use_jdbc_metadata_defaults=false

# HikariCP Base Configuration (overridden in environment-specific files)
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.connection-test-query=SELECT 1

# Allow application to start even if database is unreachable
# Connection will be established on first use
spring.datasource.hikari.initialization-fail-timeout=-1
spring.sql.init.mode=never

# HikariCP Performance Optimization
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=ITAssetManagementPool
spring.datasource.hikari.leak-detection-threshold=60000

# ============================================================================
# Flyway Database Migration
# ============================================================================
spring.flyway.enabled=false

# ============================================================================
# Logging Configuration
# ============================================================================
logging.level.root=INFO
logging.level.com.company.assetmanagement=INFO
logging.level.org.springframework.web.cors=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Security Audit Logging
logging.level.SECURITY_AUDIT=INFO
logging.file.name=${LOGGING_FILE_PATH:logs/application.log}
logging.file.max-size=10MB
logging.file.max-history=30
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30

# ============================================================================
# File Upload Configuration
# ============================================================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.enabled=true
spring.servlet.multipart.resolve-lazily=false

# ============================================================================
# OpenAPI/Swagger Documentation
# ============================================================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.show-actuator=false

# OpenAPI Server Configuration for context path
springdoc.swagger-ui.disable-swagger-default-url=true

# Swagger Server URL - Override in deployment with ALB URL
# Set this environment variable in your deployment: SWAGGER_SERVER_URL=https://your-domain.com/qa/api
# For local development, leave empty to use localhost
swagger.server.url=${SWAGGER_SERVER_URL:http://it-assets-alb-2071352516.us-west-2.elb.amazonaws.com/qa/api}

# ============================================================================
# JWT Configuration
# ============================================================================
# JWT secret must be at least 256 bits (32 characters)
# Override in environment-specific files or via environment variables
jwt.secret=${JWT_SECRET:defaultSecretKeyForDevelopmentOnlyMinimum256BitsRequired}
jwt.expiration=1800000
jwt.refresh-expiration=86400000

# ============================================================================
# CORS Configuration
# ============================================================================
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://it-assets-alb-2071352516.us-west-2.elb.amazonaws.com,https://it-assets-alb-2071352516.us-west-2.elb.amazonaws.com}
# ============================================================================
# Spring Security Configuration
# ============================================================================
spring.security.filter.order=10

# ============================================================================
# Actuator Configuration
# ============================================================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true

# Disable database health check to allow app to start even if DB is temporarily unavailable
# This prevents health check failures during DB connection issues
# WARNING: This means /actuator/health will return UP even if database is down
management.health.db.enabled=false

# ============================================================================
# Session Configuration
# ============================================================================
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true

# ============================================================================
# Server Configuration
# ============================================================================
server.error.include-message=on-param
server.error.include-binding-errors=on-param
server.error.include-stacktrace=on-param
server.error.include-exception=false

# ============================================================================
# Jackson JSON Configuration
# ============================================================================
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC
spring.jackson.default-property-inclusion=non_null

# ============================================================================
# Validation Configuration
# ============================================================================
spring.validation.enabled=true

# ============================================================================
# Caching Configuration
# ============================================================================
spring.cache.type=simple
spring.cache.cache-names=users,roles,sessions
cache.user.ttl=300
cache.role.ttl=600
cache.session.ttl=60
cache.max-users=1000
